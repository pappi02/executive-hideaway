name: Uptime check

# GitHub emails the repository owner when a scheduled run fails. Scheduled runs
# can start several minutes late, so this is a safety net rather than an alarm
# to the minute.
on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site and database respond
        run: |
          site=https://www.thehideawayresortandspaintercontinental.com
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 "$site/api/health"
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 --output /dev/null "$site/"
