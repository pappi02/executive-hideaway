<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0a" />
    <title>You're offline | Hideaway</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        display: flex;
        min-height: 100svh;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: #0b0b0a;
        color: #f5f1e8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      img { display: block; width: 112px; height: auto; margin: 0 auto 32px; }
      h1 { margin: 0; font-size: 28px; font-weight: 300; letter-spacing: -0.02em; }
      p { margin: 14px 0 0; font-size: 14px; line-height: 1.7; color: rgba(245, 241, 232, 0.55); }
      a {
        display: inline-flex;
        margin-top: 28px;
        min-height: 48px;
        align-items: center;
        padding: 0 28px;
        border-radius: 999px;
        background: #c8a96b;
        color: #0b0b0a;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/hideaway-logo-light.svg" alt="The Hideaway Spa and Resort" width="509" height="591" />
      <h1>You're offline</h1>
      <p>Check your internet connection, then try again. To book, you can also call us on 0719 506 995.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
